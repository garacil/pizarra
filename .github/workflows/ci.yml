name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: GNU/Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout without a JavaScript action
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler fp-units-fcl fp-units-db \
            sqlite3 tmux lsof psmisc util-linux

      - name: Build and verify binaries
        run: |
          ./configure
          make test
          make debug
          scripts/test-bootstrap-layout.sh
          scripts/test-private-config.sh
          scripts/test-group-onblock.sh
          scripts/test-pzshare-symlink.sh
          scripts/test-migrate-release-layout.sh
          scripts/test-retire-repo-runtime-conf.sh
          scripts/test-install-service.sh
          scripts/test-pzweb-readiness.sh
          scripts/test-session-preservation.sh
          scripts/test-watchdog-session.sh

      - name: Verify a non-default installation prefix
        run: |
          make clean
          ./configure --prefix=/opt/pizarra
          make test
          scripts/test-install-service.sh
